# Local development only (BACKEND.md §8). Not deployed.
#   docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fretflow
      POSTGRES_PASSWORD: fretflow
      POSTGRES_DB: fretflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fretflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 stand-in for local audio uploads. Production uses Cloudflare R2.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fretflow
      MINIO_ROOT_PASSWORD: fretflow-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 fretflow fretflow-dev-secret; do sleep 1; done &&
             mc mb --ignore-existing local/fretflow-audio &&
             mc anonymous set none local/fretflow-audio"

volumes:
  pgdata:
  miniodata:
