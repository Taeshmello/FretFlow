# Host Nginx for fretflow.iliasai.com (install as /etc/nginx/sites-available/fretflow).
#
# The domain is proxied by Cloudflare (orange cloud). Set Cloudflare SSL/TLS mode
# to "Full (strict)" and install an origin certificate at the two paths below
# before running `nginx -t` (see DEPLOYMENT.txt §5).

# Port 80: ACME webroot (Let's Encrypt option) and redirect everything else.
server {
    listen 80;
    listen [::]:80;
    server_name fretflow.iliasai.com;
    server_tokens off;

    include /etc/nginx/snippets/fretflow-cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fretflow.iliasai.com;
    server_tokens off;

    ssl_certificate     /etc/ssl/fretflow/origin.pem;
    ssl_certificate_key /etc/ssl/fretflow/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fretflow_ssl:10m;
    ssl_session_timeout 1d;

    # Real client IP from Cloudflare. Only trusted when the TCP peer is a
    # Cloudflare edge, so a direct request cannot spoof CF-Connecting-IP.
    include /etc/nginx/snippets/fretflow-cloudflare-realip.conf;

    # Score snapshots are capped at 5 MB by the API; audio goes straight to S3.
    client_max_body_size 6m;

    # No includeSubDomains: other iliasai.com hosts are not managed here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;  # FRETFLOW_API_HOST_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # CLIENT_IP_HEADER=x-real-ip: always overwritten here, never passed through.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Hono secureHeaders also sends HSTS; keep the single host-level header.
        proxy_hide_header Strict-Transport-Security;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;  # FRETFLOW_WEB_HOST_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
