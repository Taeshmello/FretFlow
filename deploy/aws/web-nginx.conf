server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/manifest+json image/svg+xml font/ttf font/otf;

    include /etc/nginx/snippets/web-security-headers.conf;

    location = /index.html {
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # The service worker and manifest must be revalidated on every load,
    # including at the Cloudflare edge, or clients keep an old shell.
    location = /sw.js {
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Digital Asset Links (Android TWA) and apple-app-site-association (iOS).
    # Never fall back to index.html here; both files must be JSON.
    location ^~ /.well-known/ {
        types { }
        default_type application/json;
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
